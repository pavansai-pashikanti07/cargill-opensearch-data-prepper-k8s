apiVersion: v1
kind: Service
metadata:
  name: data-prepper-service
  namespace: observability
  labels:
    app.kubernetes.io/name: data-prepper
spec:
  type: ClusterIP
  ports:
    - port: 2021
      targetPort: 2021
      name: http-metrics
      protocol: TCP
  selector:
    app: data-prepper
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-prepper-hpa
  namespace: observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opensearch-data-prepper
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
